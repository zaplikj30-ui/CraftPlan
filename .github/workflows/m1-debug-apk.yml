name: CraftPlan M1 - test APK

on:
  push:
    branches:
      - m1/first-dimension

permissions:
  contents: read

jobs:
  debug:
    if: contains(github.event.head_commit.message, '[publish m1 debug apk]') && github.run_attempt == 1
    concurrency:
      group: craftplan-m1-debug-apk
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout M1 branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK, JVM tests and lint
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Record APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftPlan-M1-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    if: contains(github.event.head_commit.message, '[publish m1 apk]') && github.run_attempt == 1
    concurrency:
      group: craftplan-m1-apk
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout M1 branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: JVM tests and lint
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" :app:testDebugUnitTest :app:lintDebug

      - name: Build and verify signed M1 APK
        env:
          CRAFTPLAN_M1_KEYSTORE_BASE64: ${{ secrets.CRAFTPLAN_M1_KEYSTORE_BASE64 }}
          CRAFTPLAN_M1_KEYSTORE_PASSWORD: ${{ secrets.CRAFTPLAN_M1_KEYSTORE_PASSWORD }}
          CRAFTPLAN_M1_CERT_SHA256: ${{ vars.CRAFTPLAN_M1_CERT_SHA256 }}
        run: bash .github/scripts/build-m1-apk.sh

      - name: Publish verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftPlan-M1-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/m1/app-m1.apk
            app/build/outputs/apk/m1/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
